name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pip-audit
          pip-audit -r requirements-build.txt --strict

      - name: Build static site
        env:
          SITE_DOMAIN: diluong.net
          LINK_CONTACT_GITHUB: ${{ secrets.LINK_CONTACT_GITHUB }}
          LINK_CONTACT_LINKEDIN: ${{ secrets.LINK_CONTACT_LINKEDIN }}
          LINK_ESUSU_REPO: ${{ secrets.LINK_ESUSU_REPO }}
          LINK_ESUSU_PRESS: ${{ secrets.LINK_ESUSU_PRESS }}
          LINK_NANNY_STATE_REPO: ${{ secrets.LINK_NANNY_STATE_REPO }}
          LINK_NANNY_STATE_PRESS: ${{ secrets.LINK_NANNY_STATE_PRESS }}
          LINK_EXPOSING_THE_INVISIBLE: ${{ secrets.LINK_EXPOSING_THE_INVISIBLE }}
          LINK_MAPPING_PRETRIAL_RISK: ${{ secrets.LINK_MAPPING_PRETRIAL_RISK }}
          LINK_DEMOCHAT_VIDEO: ${{ secrets.LINK_DEMOCHAT_VIDEO }}
          LINK_DEMOCHAT_PRESS: ${{ secrets.LINK_DEMOCHAT_PRESS }}
        run: chmod +x scripts/build_static_site.sh && ./scripts/build_static_site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true # required for /.well-known/security.txt

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
