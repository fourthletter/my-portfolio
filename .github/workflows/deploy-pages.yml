name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        env:
          LINK_CONTACT_GITHUB: ${{ secrets.LINK_CONTACT_GITHUB }}
          LINK_CONTACT_LINKEDIN: ${{ secrets.LINK_CONTACT_LINKEDIN }}
          LINK_ESUSU_REPO: ${{ secrets.LINK_ESUSU_REPO }}
          LINK_ESUSU_PRESS: ${{ secrets.LINK_ESUSU_PRESS }}
          LINK_NANNY_STATE_REPO: ${{ secrets.LINK_NANNY_STATE_REPO }}
          LINK_NANNY_STATE_PRESS: ${{ secrets.LINK_NANNY_STATE_PRESS }}
          LINK_EXPOSING_THE_INVISIBLE: ${{ secrets.LINK_EXPOSING_THE_INVISIBLE }}
          LINK_MAPPING_PRETRIAL_RISK: ${{ secrets.LINK_MAPPING_PRETRIAL_RISK }}
          LINK_DEMOCHAT_VIDEO: ${{ secrets.LINK_DEMOCHAT_VIDEO }}
          LINK_DEMOCHAT_PRESS: ${{ secrets.LINK_DEMOCHAT_PRESS }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          python build_static.py
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > dist/CNAME; fi
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
