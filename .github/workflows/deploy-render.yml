name: Deploy to Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Blueprint sync
        env:
          SYNC_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$SYNC_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Copy the Blueprint Sync Hook from Render → Blueprint → Settings"
            echo "and add it as a GitHub Actions secret named RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          response=$(curl --fail --silent --show-error --request POST "$SYNC_HOOK")
          echo "$response"
          echo "Render Blueprint sync triggered."
