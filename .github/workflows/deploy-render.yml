name: Deploy to Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "After applying the Render Blueprint, copy the deploy hook from"
            echo "Render → diluong-portfolio → Settings → Deploy Hook"
            echo "and add it as a GitHub Actions secret named RENDER_DEPLOY_HOOK_URL."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Render deploy triggered."
