# Render Blueprint: static site (Frozen-Flask → dist/)
# Launch: https://dashboard.render.com/blueprint/new?repo=https://github.com/fourthletter/my-portfolio
# Set each LINK_* env var when applying the Blueprint (same values as GitHub Actions secrets).

services:
  - type: web
    name: diluong-portfolio
    runtime: static
    repo: https://github.com/fourthletter/my-portfolio
    branch: main
    buildCommand: pip install -r requirements-build.txt && chmod +x scripts/build_static_site.sh && WRITE_CNAME=0 ./scripts/build_static_site.sh
    staticPublishPath: ./dist
    domains:
      - diluong.net
    # Re-enabled until Render custom domain is verified and serving traffic.
    # renderSubdomainPolicy: disabled
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LINK_CONTACT_GITHUB
        sync: false
      - key: LINK_CONTACT_LINKEDIN
        sync: false
      - key: LINK_ESUSU_REPO
        sync: false
      - key: LINK_ESUSU_PRESS
        sync: false
      - key: LINK_NANNY_STATE_REPO
        sync: false
      - key: LINK_NANNY_STATE_PRESS
        sync: false
      - key: LINK_EXPOSING_THE_INVISIBLE
        sync: false
      - key: LINK_MAPPING_PRETRIAL_RISK
        sync: false
      - key: LINK_DEMOCHAT_VIDEO
        sync: false
      - key: LINK_DEMOCHAT_PRESS
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
