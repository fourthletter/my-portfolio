<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-row">
        <a href="{{ url_for('home') }}" class="brand">Di Luong</a>
        <nav class="nav-links">
          {% for item in nav_items %}
            {% set href = url_for(item.endpoint) %}
            {% set active = request_path == href or (href != '/' and request_path.startswith(href + '/')) %}
            <a href="{{ href }}" class="{{ 'active' if active else '' }}">{{ item.label }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    {% block content %}{% endblock %}
  </body>
</html>
