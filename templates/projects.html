{% extends "base.html" %}
{% block content %}
  <main>
    <section class="container section fade-in-up">
      <p class="eyebrow">Projects</p>
      <h1>Selected work across technology and social impact.</h1>
      <div class="card-grid">
        {% for project in projects %}
          <article class="card">
            <h2>{{ project.title }}</h2>
            <p class="body">{{ project.description }}</p>
            <div class="tag-wrap">
              {% for tag in project.stack %}
                <span class="tag outlined">{{ tag }}</span>
              {% endfor %}
            </div>
            <a href="{{ url_for('project_detail', slug=project.slug) }}" class="inline-link">Read case study</a>
          </article>
        {% endfor %}
      </div>
    </section>
  </main>
{% endblock %}
